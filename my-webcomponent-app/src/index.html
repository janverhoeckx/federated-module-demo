<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>MyWebcomponentApp</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="stylesheet" href="custom-style.css">
</head>
<body>
<my-element name="Jan"></my-element>

<overview-element></overview-element>

<script>
  const myElement = document.querySelector('my-element');

  // Dummy function to get access token which can be used by the webcomponent
  function getAccessToken() {
    return 'my-access-token-from-shell';
  }

  myElement.getToken = getAccessToken;

  // Event listener to listen to the greet event
  myElement.addEventListener('greet', (event) => {
    alert(event.detail);
  });
</script>
</body>
</html>
